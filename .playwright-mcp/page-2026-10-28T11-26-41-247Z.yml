                - 'img "ACG 2026 Cirrhosis Prevention Guideline: From Portal Hypertension to Whole-Patient Care" [ref=f1e54]'
                - generic [ref=f1e55]:
                  - generic [ref=f1e57]:
                    - paragraph [ref=f1e58]
                    - paragraph [ref=f1e59]:
                      - strong [ref=f1e60]: For a patient with compensated cirrhosis who has never experienced ascites, variceal bleeding, or hepatic encephalopathy, what should clinicians do today to reduce the likelihood of complications tomorrow?
                    - paragraph [ref=f1e61]: "For patients who have already decompensated, the question becomes equally important: which preventive measures remain beneficial, and how can they be delivered consistently across hospital and outpatient settings?"
                    - paragraph [ref=f1e62]:
                      - text: These questions form the foundation of the 2026 American College of Gastroenterology (ACG) Clinical Guideline on Preventive Care for Patients With Cirrhosis, published online in the
                      - emphasis [ref=f1e63]: American Journal of Gastroenterology
                      - text: on October 5, 2026.
                    - paragraph [ref=f1e64]: The document challenges a predominantly complication-driven model of cirrhosis care. Rather than concentrating exclusively on established ascites, bleeding, and encephalopathy, it emphasizes interventions that may reduce future complications, improve functional health, and address preventable risks outside the liver.
                    - paragraph [ref=f1e65]: Its scope is deliberately broad. Portal hypertension, hepatocellular carcinoma (HCC), vaccination, nutrition, exercise, alcohol use disorder, smoking, and osteoporosis all appear within a coordinated preventive-care framework.
                    - paragraph [ref=f1e66]: For gastroenterologists and hepatologists, the key clinical challenge is not simply knowing these interventions individually, but identifying which patients need them and ensuring they are delivered at the appropriate time.
                    - heading "1. Why Cirrhosis Prevention Requires a Broader Clinical Framework" [level=2] [ref=f1e67]
                    - paragraph [ref=f1e68]: Cirrhosis affects more than two million Americans and contributes substantially to mortality, impaired quality of life, and healthcare utilization.
                    - paragraph [ref=f1e69]: Yet cirrhosis is not uniformly progressive.
                    - paragraph [ref=f1e70]: Patients with compensated disease may maintain a relatively favorable prognosis, while selected patients with previously decompensated disease can experience recompensation.
                    - paragraph [ref=f1e71]: This variability creates an important opportunity for preventive intervention.
                    - paragraph [ref=f1e72]: "The 2026 ACG guideline organizes preventive care into four domains:"
                    - list [ref=f1e73]:
                      - listitem [ref=f1e74]:
                        - paragraph [ref=f1e75]: Prevention of cirrhosis-specific complications
                      - listitem [ref=f1e76]:
                        - paragraph [ref=f1e77]: Prevention of infections
                      - listitem [ref=f1e78]:
                        - paragraph [ref=f1e79]: Promotion of health through lifestyle interventions
                      - listitem [ref=f1e80]:
                        - paragraph [ref=f1e81]: Prevention of non-liver-specific conditions
                    - paragraph [ref=f1e82]: The guideline contains 18 evidence-graded recommendations and six additional key concept statements.
                    - paragraph [ref=f1e83]: Its clinical scope is broader than conventional strategies focused only on portal hypertension and HCC surveillance.
                    - paragraph [ref=f1e84]: For example, a patient may receive appropriate variceal prophylaxis but remain vulnerable to vaccine-preventable infection, malnutrition, declining physical function, or osteoporotic fracture.
                    - paragraph [ref=f1e85]: The guideline encourages clinicians to consider these risks together.
                    - paragraph [ref=f1e86]: Importantly, prevention must still be individualized according to disease stage, treatment eligibility, tolerability, and patient preferences.
                    - heading "2. How the ACG Developed Its Recommendations" [level=2] [ref=f1e87]
                    - paragraph [ref=f1e88]: This publication is a clinical practice guideline rather than a newly conducted randomized controlled trial.
                    - paragraph [ref=f1e89]: A hepatology expert writing group, supported by two GRADE methodologists, developed structured clinical questions using the Population, Intervention, Comparator, and Outcomes (PICO) framework.
                    - paragraph [ref=f1e90]: Librarian-assisted literature searches covered PubMed, Embase, and the Cochrane Library.
                    - paragraph [ref=f1e91]: Systematic reviews, meta-analyses, and randomized trials were prioritized when evaluating evidence.
                    - paragraph [ref=f1e92]: The Grading of Recommendations Assessment, Development and Evaluation (GRADE) approach was used to distinguish recommendation strength from certainty of evidence.
                    - paragraph [ref=f1e93]: This distinction is particularly important because most recommendations are supported by low-certainty evidence.
                    - paragraph [ref=f1e94]: Strong recommendations may nevertheless be appropriate when anticipated benefits, potential harms, feasibility, and clinical values favor an intervention.
                    - paragraph [ref=f1e95]: Consequently, clinicians should not interpret all 18 recommendations as having equivalent evidentiary strength.
                    - paragraph [ref=f1e96]: Nor should the guideline be mistaken for a single trial demonstrating that an integrated preventive-care package reduces mortality.
                    - paragraph [ref=f1e97]: Its contribution is to synthesize available evidence and establish a practical framework for preventive clinical decisions.
                    - 'heading "3. Portal Hypertension: Preventing Bleeding and First Decompensation" [level=2] [ref=f1e98]'
                    - paragraph [ref=f1e99]: Portal hypertension remains central to cirrhosis-related morbidity.
                    - paragraph [ref=f1e100]: The guideline strongly recommends carvedilol or endoscopic variceal ligation (EVL) for primary prophylaxis against variceal bleeding in patients with high-risk esophageal varices.
                    - paragraph [ref=f1e101]: This was the only recommendation supported by moderate-certainty evidence.
                    - paragraph [ref=f1e102]: The choice between carvedilol and EVL requires individualized assessment.
                    - paragraph [ref=f1e103]: Carvedilol offers pharmacological reduction of portal pressure, whereas EVL provides an endoscopic strategy for treating high-risk varices.
                    - paragraph [ref=f1e104]: Medication tolerability, hemodynamic status, contraindications, patient preference, and availability of endoscopic services influence treatment selection.
                    - paragraph [ref=f1e105]: A separate conditional recommendation addresses patients with compensated cirrhosis and clinically significant portal hypertension (CSPH).
                    - paragraph [ref=f1e106]: For this population, the guideline suggests carvedilol to reduce the incidence of first-episode ascites.
                    - paragraph [ref=f1e107]: This recommendation differs from prophylaxis for established high-risk varices. It concerns patients at risk of their first decompensating event.
                    - paragraph [ref=f1e108]: CSPH assessment may incorporate noninvasive information, including liver stiffness measurements and platelet count, within an appropriate clinical evaluation.
                    - paragraph [ref=f1e109]: However, a conditional recommendation should not be interpreted as authorization to prescribe carvedilol indiscriminately to every patient with compensated cirrhosis.
                    - paragraph [ref=f1e110]: The preventive benefit must be weighed against individual safety considerations.
                    - paragraph [ref=f1e111]: The broader clinical implication is that portal hypertension assessment has a role before overt decompensation, not only after variceal bleeding or ascites develops.
                    - 'heading "4. Hepatic Encephalopathy and Gastrointestinal Bleeding: Preventing Recurrence and Secondary Harm" [level=2] [ref=f1e112]'
                    - paragraph [ref=f1e113]: Hepatic encephalopathy (HE) presents a different preventive challenge because risk and treatment objectives vary across disease stages.
                    - paragraph [ref=f1e114]: For patients with minimal HE, the guideline conditionally suggests lactulose rather than no treatment.
                    - paragraph [ref=f1e115]: However, it does not suggest rifaximin solely as primary prevention of overt HE in patients with minimal HE.
                    - paragraph [ref=f1e116]: This is a clinically important distinction.
                    - paragraph [ref=f1e117]: Improving symptoms or neurocognitive performance is not necessarily equivalent to demonstrating prevention of overt encephalopathy.
                    - paragraph [ref=f1e118]: For patients who experience overt HE while receiving lactulose, the guideline conditionally suggests adding rifaximin to prevent recurrence.
                    - paragraph [ref=f1e119]: Treatment decisions should therefore distinguish minimal HE, prior overt HE, and breakthrough episodes despite existing therapy.
                    - paragraph [ref=f1e120]: The guideline also addresses antibiotic prophylaxis during upper gastrointestinal bleeding.
                    - paragraph [ref=f1e121]: For patients with cirrhosis experiencing upper GI bleeding, it conditionally suggests a short prophylactic antibiotic course of approximately 2–3 days, compared with a longer course or no prophylaxis.
                    - paragraph [ref=f1e122]: This recommendation highlights antimicrobial stewardship while acknowledging uncertainty about the optimal balance between infection prevention, duration of exposure, and adverse consequences.
                    - paragraph [ref=f1e123]: Importantly, prophylaxis during bleeding is not interchangeable with treatment for an established infection.
                    - paragraph [ref=f1e124]: Clinicians should apply the recommendation in the appropriate clinical context, considering disease severity, infection status, and local antimicrobial resistance.
                    - paragraph [ref=f1e125]: Both HE management and gastrointestinal bleeding prophylaxis illustrate the guideline's emphasis on reducing complications through appropriately targeted interventions rather than automatically intensifying treatment.
                    - 'heading "5. HCC Surveillance: Eligibility Matters as Much as the Interval" [level=2] [ref=f1e126]'
                    - paragraph [ref=f1e127]: Hepatocellular carcinoma remains a major concern throughout the course of cirrhosis.
                    - paragraph [ref=f1e128]: The ACG strongly recommends HCC surveillance using liver ultrasound and alpha-fetoprotein (AFP) every six months in patients with cirrhosis who are candidates for HCC-directed therapies.
                    - paragraph [ref=f1e129]: The qualification regarding treatment eligibility is essential.
                    - paragraph [ref=f1e130]: Surveillance is intended to identify potentially actionable disease. Its value depends partly on whether a patient could receive appropriate treatment if HCC were detected.
                    - paragraph [ref=f1e131]: Accordingly, decisions should consider clinical status, treatment options, and individual goals of care rather than applying surveillance mechanically.
                    - paragraph [ref=f1e132]: The guideline also addresses medications proposed for cancer prevention.
                    - paragraph [ref=f1e133]: It conditionally advises against prescribing aspirin solely to prevent HCC in patients with cirrhosis.
                    - paragraph [ref=f1e134]: This should not be interpreted as a general prohibition against aspirin when a separate established indication exists.
                    - paragraph [ref=f1e135]: The critical distinction is between observational associations suggesting reduced cancer risk and sufficiently reliable evidence to recommend a medication specifically for chemoprevention.
                    - paragraph [ref=f1e136]: Similarly, the guideline's preventive framework does not establish a role for initiating otherwise unindicated medication solely on the basis of possible HCC risk reduction.
                    - paragraph [ref=f1e137]: For clinicians, the immediate priority remains reliable surveillance in eligible patients, rather than adding unproven chemopreventive strategies.
                    - 'heading "6. Vaccination: A Core Component of Cirrhosis Management" [level=2] [ref=f1e138]'
                    - paragraph [ref=f1e139]: Infection prevention receives substantial attention in the ACG document.
                    - paragraph [ref=f1e140]: The guideline strongly recommends assessing hepatitis A immunity and vaccinating susceptible patients.
                    - paragraph [ref=f1e141]: It also conditionally suggests hepatitis B immunity assessment and vaccination.
                    - paragraph [ref=f1e142]: Additional strong recommendations cover influenza immunization, SARS-CoV-2 vaccination, and respiratory syncytial virus (RSV) vaccination.
                    - paragraph [ref=f1e143]: For RSV, the guideline specifies vaccination for patients with cirrhosis aged 50 years or older.
                    - paragraph [ref=f1e144]: Implementation should account for applicable national immunization schedules, product availability, regulatory indications, and individual eligibility.
                    - paragraph [ref=f1e145]: These recommendations are notable because preventive hepatology often concentrates on infections arising directly from decompensated disease, whereas routine vaccination addresses broader infectious risks.
                    - paragraph [ref=f1e146]: The certainty of evidence for several vaccination recommendations remains low, despite their strong recommendation status.
                    - paragraph [ref=f1e147]: This reflects the panel's assessment of anticipated benefits and established vaccine safety rather than uniform availability of cirrhosis-specific randomized outcome data.
                    - paragraph [ref=f1e148]: In practical terms, immunization history should form part of routine liver clinic assessment.
                    - paragraph [ref=f1e149]: A vaccination review is particularly relevant when patients first enter specialist care, after hospitalization, or when preventive health information is incomplete.
                    - 'heading "7. Nutrition and Exercise: Addressing Functional Vulnerability" [level=2] [ref=f1e150]'
                    - paragraph [ref=f1e151]: Cirrhosis management cannot be separated from nutritional and physical function.
                    - paragraph [ref=f1e152]: The guideline conditionally suggests dietitian-guided nutritional interventions that provide adequate protein and calories.
                    - paragraph [ref=f1e153]: It also suggests structured aerobic and resistance exercise for ambulatory patients to improve muscle health and physical function.
                    - paragraph [ref=f1e154]: These recommendations recognize that clinical outcomes are influenced by more than biochemical indices and measures of portal hypertension.
                    - paragraph [ref=f1e155]: Malnutrition, reduced muscle strength, and impaired physical performance can complicate long-term care.
                    - paragraph [ref=f1e156]: Nevertheless, nutritional interventions should be individualized.
                    - paragraph [ref=f1e157]: Patients differ in body composition, obesity status, functional capacity, nutritional needs, and complications of liver disease.
                    - paragraph [ref=f1e158]: Similarly, structured exercise requires appropriate selection and adjustment rather than a uniform activity prescription.
                    - paragraph [ref=f1e159]: The guideline does not establish that every patient will achieve equivalent functional improvement or that a particular exercise program definitively reduces mortality.
                    - paragraph [ref=f1e160]: For clinicians, the relevant practice signal is to make nutrition and physical function active components of longitudinal assessment.
                    - paragraph [ref=f1e161]: This may require closer collaboration with dietitians and rehabilitation professionals rather than expecting hepatology consultations alone to deliver all necessary interventions.
                    - heading "8. Alcohol Use, Smoking, and Bone Health Beyond the Liver" [level=2] [ref=f1e162]
                    - paragraph [ref=f1e163]: The guideline also addresses modifiable behaviors and extrahepatic conditions.
                    - paragraph [ref=f1e164]: For patients hospitalized with cirrhosis and alcohol use disorder, the ACG conditionally suggests postdischarge behavioral therapy to reduce alcohol use.
                    - paragraph [ref=f1e165]: This recommendation highlights the importance of continuity after hospitalization.
                    - paragraph [ref=f1e166]: An inpatient admission may create an opportunity to identify alcohol-related needs, but preventive benefit depends on successful transition to ongoing care.
                    - paragraph [ref=f1e167]: The guideline separately makes a strong recommendation for smoking-cessation counseling in patients with cirrhosis who actively smoke.
                    - paragraph [ref=f1e168]: Smoking prevention is relevant to overall health and should not be treated as unrelated to hepatology.
                    - paragraph [ref=f1e169]: Bone health is another important component.
                    - paragraph [ref=f1e170]: For patients with cirrhosis and osteoporosis, the guideline conditionally suggests bisphosphonate therapy to reduce fracture risk.
                    - paragraph [ref=f1e171]: This recommendation concerns patients with established osteoporosis; it is not a recommendation for universal bisphosphonate treatment in cirrhosis.
                    - paragraph [ref=f1e172]: Treatment requires assessment of conventional indications, contraindications, tolerability, and relevant comorbidities.
                    - paragraph [ref=f1e173]: Together, these recommendations reinforce a whole-patient approach.
                    - paragraph [ref=f1e174]: Preventive care should consider the consequences of liver disease alongside other conditions that influence functional health, quality of life, and future healthcare needs.
                    - heading "9. Turning Recommendations Into Reliable Clinical Practice" [level=2] [ref=f1e175]
                    - paragraph [ref=f1e176]: "The guideline's implementation framework emphasizes three complementary activities: education and dissemination, stakeholder engagement, and integration into routine practice."
                    - paragraph [ref=f1e177]: This is particularly relevant because preventive recommendations span multiple clinical environments.
                    - paragraph [ref=f1e178]: Specialist clinics may initiate portal hypertension assessment and HCC surveillance, while vaccination, smoking cessation, nutrition, rehabilitation, and postdischarge support frequently involve other healthcare professionals.
                    - paragraph [ref=f1e179]: A reasonable implementation approach is a structured preventive-care review incorporating disease-specific complications, immunization status, lifestyle needs, nutritional function, and bone health.
                    - paragraph [ref=f1e180]: Electronic health records may also help identify overdue assessments and follow-up requirements.
                    - paragraph [ref=f1e181]: However, the guideline does not demonstrate that any single checklist, electronic reminder, or implementation strategy independently improves survival.
                    - paragraph [ref=f1e182]: Preventive systems should therefore be evaluated for feasibility, reliability, and patient-centered outcomes.
                    - paragraph [ref=f1e183]: The evidence base also has broader limitations.
                    - paragraph [ref=f1e184]: Most recommendations rely on low-certainty evidence, and different interventions address substantially different outcomes.
                    - paragraph [ref=f1e185]: Results from studies involving specific cirrhosis populations may not apply equally to patients with advanced decompensation, major comorbidities, or limited access to multidisciplinary services.
                    - paragraph [ref=f1e186]: Future research should prioritize clinically meaningful outcomes, comparative effectiveness, intervention tolerability, and implementation across diverse healthcare systems.
                    - paragraph [ref=f1e187]: Importantly, a strong recommendation is not synonymous with high-certainty evidence, and an observational association should not be presented as proof of causation.
                    - paragraph [ref=f1e188]
