                  - generic [ref=f1e218]:
                    - heading "Five key clinical takeaways" [level=2] [ref=f1e219]
                    - paragraph [ref=f1e220]: 1. Prevent decompensation proactively. Carvedilol or EVL is strongly recommended for high-risk esophageal varices; carvedilol is conditionally suggested in compensated cirrhosis with CSPH to reduce first-episode ascites.
                    - paragraph [ref=f1e221]: 2. Maintain six-monthly HCC surveillance in eligible patients. The recommended strategy is ultrasound plus AFP. Aspirin should not be initiated solely for HCC prevention.
                    - paragraph [ref=f1e222]: 3. Distinguish stages of hepatic encephalopathy. Lactulose may be considered for minimal HE; adjunctive rifaximin is suggested following overt HE despite lactulose, not routinely for primary prevention in minimal HE.
                    - paragraph [ref=f1e223]: 4. Make vaccination and functional health routine priorities. Review hepatitis A and B immunity, respiratory immunization, nutritional status, physical function and smoking at appropriate clinical encounters.
                    - paragraph [ref=f1e224]: 5. Treat cirrhosis as a whole-patient condition. Postdischarge behavioral treatment for alcohol use disorder, dietitian-guided nutrition, structured exercise and osteoporosis treatment are important components of preventive care, although several recommendations are conditional.
