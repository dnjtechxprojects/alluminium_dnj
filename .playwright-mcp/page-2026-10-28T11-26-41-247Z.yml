                  - generic [ref=f1e197]:
                    - paragraph [ref=f1e198]
                    - 'heading "Clinical Takeaway: Prevention Must Become a Routine Part of Cirrhosis Care" [level=2] [ref=f1e199]'
                    - paragraph [ref=f1e200]: The 2026 ACG guideline presents prevention as a longitudinal responsibility rather than an additional task performed only after complications develop.
                    - paragraph [ref=f1e201]: Its recommendations support appropriate variceal prophylaxis, risk-informed portal hypertension management, HCC surveillance, vaccination, targeted encephalopathy prevention, nutritional intervention, physical activity, behavioral support, and osteoporosis treatment.
                    - paragraph [ref=f1e202]: The principal clinical message is not that every intervention is equally effective or universally applicable.
                    - paragraph [ref=f1e203]: Instead, the most useful change is to make preventive assessment systematic, individualized, and continuous throughout cirrhosis care.
                    - paragraph [ref=f1e204]:
                      - strong [ref=f1e205]: "GastroAGI Perspective:"
                      - text: This guideline offers a practical framework for more comprehensive management of cirrhosis. Its strongest signals concern established preventive interventions and reliable delivery of care. However, low evidence certainty across many recommendations, variable patient eligibility, and unresolved implementation questions require careful clinical interpretation.
