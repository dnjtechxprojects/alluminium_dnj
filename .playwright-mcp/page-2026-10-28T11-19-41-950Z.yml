                  - generic [ref=f1e123]: What did the study find? At a single centre, 34 patients with locally advanced pancreatic cancer (LAPC) underwent induction chemotherapy followed by ablative-dose radiotherapy (≥98 Gy biologically effective...
              - generic [ref=f1e128]:
                - paragraph [ref=f1e129]: What did the study find?
                - paragraph [ref=f1e130]: At a single centre, 34 patients with locally advanced pancreatic cancer (LAPC) underwent induction chemotherapy followed by ablative-dose radiotherapy (≥98 Gy biologically effective dose) and surgical exploration. Resection was completed in 25 patients (74%); exploration was aborted in 9 because of metastatic disease or local unresectability. Major pathologic response was seen in 17% of resected specimens. Postoperative 90-day mortality was 5.9%. Median follow-up was 31 months from diagnosis; 2-year overall survival from completion of radiotherapy was 24 months.
                - paragraph [ref=f1e131]: Why does it matter?
                - paragraph [ref=f1e132]: The findings suggest that resection after induction chemotherapy and ablative radiotherapy may be feasible for selected patients with locally advanced disease. However, many patients did not proceed to resection, and serious postoperative complications occurred.
                - paragraph [ref=f1e133]: GastroAGI takeaway
                - paragraph [ref=f1e134]: Ablative radiotherapy followed by exploration is a potential strategy for carefully selected patients, but this small, retrospective, single-center study cannot establish that it improves survival or is superior to other approaches.
