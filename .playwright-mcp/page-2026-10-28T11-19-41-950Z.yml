              - 'button "Ablative Radiation Followed by Surgery for LAPC: Annals of Surgical Oncology. 2025;32:4108–4116 DOI 10.1245/s10434-025-17199-8 What did the study find? At a single centre, 34 patients with locally advanced pancreatic cancer (LAPC) underwent induction chemotherapy followed by ablative-dose radiotherapy (≥98 Gy biologically effective..." [ref=f1e113] [cursor=pointer]':
