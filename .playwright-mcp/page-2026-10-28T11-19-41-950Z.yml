                - generic [ref=f1e89]:
                  - generic [ref=f1e90]:
                    - text: "TL1A-activated T cells may remodel the rectal mucosa in fistulising CD: Gut"
                    - link "DOI 10.1136/gutjnl-2025-336246" [ref=f1e91]:
                      - /url: https://doi.org/10.1136/gutjnl-2025-336246
                      - generic [ref=f1e92]: DOI
                      - generic [ref=f1e93]: 10.1136/gutjnl-2025-336246
                  - generic [ref=f1e97]: What did the study find? Single-cell RNA sequencing of rectal biopsies from 31 patients with Crohn’s disease identified cellular and gene-expression changes associated with perianal fistulising disease. These...
              - generic [ref=f1e102]:
                - paragraph [ref=f1e103]: What did the study find?
                - paragraph [ref=f1e104]: Single-cell RNA sequencing of rectal biopsies from 31 patients with Crohn’s disease identified cellular and gene-expression changes associated with perianal fistulising disease. These changes were present independently of luminal inflammation and may be driven by TL1A activation in CD4+ T cells.
                - paragraph [ref=f1e105]: Functional experiments identified lymphotoxin α1β2 and IL-22 as downstream mediators. Together, they induced changes in rectal fibroblasts and epithelial cells, including increased fibroblast abundance, matrix-degrading enzyme expression, and antibacterial and immune-response signatures. The TL1A-linked pathways remained active despite TNF blockade.
                - paragraph [ref=f1e106]: Why does it matter?
                - paragraph [ref=f1e107]: The findings suggest that fistula-associated tissue changes may involve a TL1A–lymphotoxin/IL-22 pathway that is partly distinct from TNF signalling. This offers a biological rationale for studying TL1A inhibition in perianal fistulising Crohn’s disease.
                - paragraph [ref=f1e108]: GastroAGI takeaway
                - paragraph [ref=f1e109]: This study identifies a potential mechanism behind fistula formation and persistence, but it does not show that TL1A-targeted treatment prevents or heals fistulas. Clinical trials are needed to test that possibility.
