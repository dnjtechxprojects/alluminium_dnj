              - generic [ref=f1e77]:
                - paragraph [ref=f1e78]: What did the study find?
                - paragraph [ref=f1e79]: The trial randomised 105 patients with decompensated cirrhosis to a 28-day home-based multidisciplinary programme or ambulatory care. LivR Well did not reduce liver-related emergency admissions (incidence rate ratio 0.92; 95% CI 0.39–2.16; P = 0.84), improve survival, or produce greater gains in MELD score or quality of life. It was not cost-effective in either economic analysis.
                - paragraph [ref=f1e80]: Why does it matter?
                - paragraph [ref=f1e81]: A coordinated home-based service may be feasible, but this trial found no measurable advantage over the care received by the control group. Both groups had access to a specialised liver nurse and a day procedure ward, which may have narrowed the difference between them.
                - paragraph [ref=f1e82]: GastroAGI takeaway
                - paragraph [ref=f1e83]: This trial did not show that LivR Well reduced admissions or costs. Future studies could compare it with standard ambulatory care and assess outcomes that better capture patients’ experience and care needs.
            - article [ref=f1e85]:
              - 'button "TL1A-activated T cells may remodel the rectal mucosa in fistulising CD: Gut DOI 10.1136/gutjnl-2025-336246 What did the study find? Single-cell RNA sequencing of rectal biopsies from 31 patients with Crohn’s disease identified cellular and gene-expression changes associated with perianal fistulising disease. These..." [ref=f1e87] [cursor=pointer]':
