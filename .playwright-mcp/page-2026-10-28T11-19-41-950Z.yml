              - generic [ref=f1e51]:
                - paragraph [ref=f1e52]: What Did the Study Find?
                - paragraph [ref=f1e53]: This study evaluated circumferential endoscopic submucosal dissection (C-ESD) for superficial oesophagal squamous cell carcinoma in 100 patients with a median lesion length of 5.2 cm. En bloc resection was achieved in 92%, R0 resection in 84%, and curative resection in 81%. Median procedure time was 97.5 minutes.
                - paragraph [ref=f1e54]: After a median follow-up of 47.4 months, 3- and 5-year overall and disease-specific survival were both 95.6%. Cumulative recurrence reached 19.8% at five years. Oesophagal strictures occurred in 88% of patients. Prophylactic measures reduced stricture incidence (80% vs 100%) and the median number of dilation sessions; 95.5% of strictures were ultimately resolved.
                - paragraph [ref=f1e55]: Why Does It Matter?
                - paragraph [ref=f1e56]: C-ESD may offer organ-preserving treatment with favourable long-term survival, but patients need counselling about the substantial likelihood of post-procedure stricture and possible repeat dilations.
                - paragraph [ref=f1e57]: GastroAGI takeaway
                - paragraph [ref=f1e58]: C-ESD can achieve durable disease control in selected circumferential superficial lesions, provided stricture prevention, dilation management, and long-term surveillance are planned.
