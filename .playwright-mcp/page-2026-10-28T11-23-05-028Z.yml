                - 'heading "ACG 2026 Cirrhosis Prevention Guideline: From Portal Hypertension to Whole-Patient Care" [level=2] [ref=e49]'
                - paragraph [ref=e50]: "For a patient with compensated cirrhosis who has never experienced ascites, variceal bleeding, or hepatic encephalopathy, what should clinicians do today to reduce the likelihood of complications tomorrow? For patients who have already decompensated, the question becomes equally important: which preventive measures remain beneficial, and how can they be delivered consistently across hospital and outpatient settings? These questions form the foundation of the 2026 American College of Gastroenterology (ACG) Clinical Guideline on Preventive Care for Patients With Cirrhosis, published online in the American Journal of Gastroenterology on October 5, 2026. The document challenges a predominantly complication-driven model of cirrhosis care. Rather than concentrating exclusively on established ascites, bleeding, and encephalopathy, it emphasizes interventions that may reduce future complications, improve functional health, and address preventable risks outside the liver. Its scope is deliberately broad. Portal hypertension, hepatocellular carcinoma (HCC), vaccination, nutrition, exercise, alcohol use disorder, smoking, and osteoporosis all appear within a coordinated preventive-care framework. For gastroenterologists and hepatologists, the key clinical challenge is not simply knowing these interventions individually, but identifying which patients need them and ensuring they are delivered at the appropriate time. 1. Why Cirrhosis Prevention Requires a Broader Clinical Framework Cirrhosis affects more than two million Americans and contributes substantially to mortality, impaired quality of life, and healthcare utilization. Yet cirrhosis is not uniformly progressive. Patients with compensated disease may maintain a relatively favorable prognosis, while selected patients with previously decompensated disease can experience recompensation. This variability creates an important opportunity for preventive intervention. The 2026 ACG guideline organizes preventive care into four domains: Prevention of cirrhosis-specific complications Prevention of infections Promotion of health through lifestyle interventions Prevention of non-liver-specific conditions The guideline contains 18 evidence-graded recommendations and six additional key concept statements. Its clinical scope is broader than conventional strategies focused only on portal hypertension and HCC surveillance. For example, a patient may receive appropriate variceal prophylaxis but remain vulnerable to vaccine-preventable infection, malnutrition, declining physical function, or osteoporotic fracture. The guideline encourages clinicians to consider these risks together. Importantly, prevention must still be individualized according to disease stage, treatment eligibility, tolerability, and patient preferences. 2. How the ACG Developed Its Recommendations This publication is a clinical practice guideline rather than a newly conducted randomized controlled trial. A hepatology expert writing group, supported by two GRADE methodologists, developed structured clinical questions using the Population, Intervention, Comparator, and Outcomes (PICO) framework. Librarian-assisted literature searches covered PubMed, Embase, and the Cochrane Library. Systematic reviews, meta-analyses, and randomized trials were prioritized when evaluating evidence. The Grading of Recommendations Assessment, Development and Evaluation (GRADE) approach was used to distinguish recommendation strength from certainty of evidence. This distinction is particularly important because most recommendations are supported by low-certainty evidence. Strong recommendations may nevertheless be appropriate when anticipated benefits, potential harms, feasibility, and clinical values favor an intervention. Consequently, clinicians should not interpret all 18 recommendations as having equivalent evidentiary strength. Nor should the guideline be mistaken for a single trial demonstrating that an integrated preventive-care package reduces mortality. Its contribution is to synthesize available evidence and establish a practical framework for preventive clinical decisions. 3. Portal Hypertension: Preventing Bleeding and First Decompensation Portal hypertension remains central to cirrhosis-related morbidity. The guideline strongly recommends carvedilol or endoscopic variceal ligation (EVL) for primary prophylaxis against variceal bleeding in patients with high-risk esophageal varices. This was the only recommendation supported by moderate-certainty evidence. The choice between carvedilol and EVL requires individualized assessment. Carvedilol offers pharmacological reduction of portal pressure, whereas EVL provides an endoscopic strategy for treating high-risk varices. Medication tolerability, hemodynamic status, contraindications, patient preference, and availability of endoscopic services influence treatment selection. A separate conditional recommendation addresses patients with compensated cirrhosis and clinically significant portal hypertension (CSPH). For this population, the guideline suggests carvedilol to reduce the incidence of first-episode ascites. This recommendation differs from prophylaxis for established high-risk varices. It concerns patients at risk of their first decompensating event. CSPH assessment may incorporate noninvasive information, including liver stiffness measurements and platelet count, within an appropriate clinical evaluation. However, a conditional recommendation should not be interpreted as authorization to prescribe carvedilol indiscriminately to every patient with compensated cirrhosis. The preventive benefit must be weighed against individual safety considerations. The broader clinical implication is that portal hypertension assessment has a role before overt decompensation, not only after variceal bleeding or ascites develops. 4. Hepatic Encephalopathy and Gastrointestinal Bleeding: Preventing Recurrence and Secondary Harm Hepatic encephalopathy (HE) presents a different preventive challenge because risk and treatment objectives vary across disease stages. For patients with minimal HE, the guideline conditionally suggests lactulose rather than no treatment. However, it does not suggest rifaximin solely as primary prevention of overt HE in patients with minimal HE. This is a clinically important distinction. Improving symptoms or neurocognitive performance is not necessarily equivalent to demonstrating prevention of overt encephalopathy. For patients who experience overt HE while receiving lactulose, the guideline conditionally suggests adding rifaximin to prevent recurrence. Treatment decisions should therefore distinguish minimal HE, prior overt HE, and breakthrough episodes despite existing therapy. The guideline also addresses antibiotic prophylaxis during upper gastrointestinal bleeding. For patients with cirrhosis experiencing upper GI bleeding, it conditionally suggests a short prophylactic antibiotic course of approximately 2–3 days, compared with a longer course or no prophylaxis. This recommendation highlights antimicrobial stewardship while acknowledging uncertainty about the optimal balance between infection prevention, duration of exposure, and adverse consequences. Importantly, prophylaxis during bleeding is not interchangeable with treatment for an established infection. Clinicians should apply the recommendation in the appropriate clinical context, considering disease severity, infection status, and local antimicrobial resistance. Both HE management and gastrointestinal bleeding prophylaxis illustrate the guideline's emphasis on reducing complications through appropriately targeted interventions rather than automatically intensifying treatment. 5. HCC Surveillance: Eligibility Matters as Much as the Interval Hepatocellular carcinoma remains a major concern throughout the course of cirrhosis. The ACG strongly recommends HCC surveillance using liver ultrasound and alpha-fetoprotein (AFP) every six months in patients with cirrhosis who are candidates for HCC-directed therapies. The qualification regarding treatment eligibility is essential. Surveillance is intended to identify potentially actionable disease. Its value depends partly on whether a patient could receive appropriate treatment if HCC were detected. Accordingly, decisions should consider clinical status, treatment options, and individual goals of care rather than applying surveillance mechanically. The guideline also addresses medications proposed for cancer prevention. It conditionally advises against prescribing aspirin solely to prevent HCC in patients with cirrhosis. This should not be interpreted as a general prohibition against aspirin when a separate established indication exists. The critical distinction is between observational associations suggesting reduced cancer risk and sufficiently reliable evidence to recommend a medication specifically for chemoprevention. Similarly, the guideline's preventive framework does not establish a role for initiating otherwise unindicated medication solely on the basis of possible HCC risk reduction. For clinicians, the immediate priority remains reliable surveillance in eligible patients, rather than adding unproven chemopreventive strategies. 6. Vaccination: A Core Component of Cirrhosis Management Infection prevention receives substantial attention in the ACG document. The guideline strongly recommends assessing hepatitis A immunity and vaccinating susceptible patients. It also conditionally suggests hepatitis B immunity assessment and vaccination. Additional strong recommendations cover influenza immunization, SARS-CoV-2 vaccination, and respiratory syncytial virus (RSV) vaccination. For RSV, the guideline specifies vaccination for patients with cirrhosis aged 50 years or older. Implementation should account for applicable national immunization schedules, product availability, regulatory indications, and individual eligibility. These recommendations are notable because preventive hepatology often concentrates on infections arising directly from decompensated disease, whereas routine vaccination addresses broader infectious risks. The certainty of evidence for several vaccination recommendations remains low, despite their strong recommendation status. This reflects the panel's assessment of anticipated benefits and established vaccine safety rather than uniform availability of cirrhosis-specific randomized outcome data. In practical terms, immunization history should form part of routine liver clinic assessment. A vaccination review is particularly relevant when patients first enter specialist care, after hospitalization, or when preventive health information is incomplete. 7. Nutrition and Exercise: Addressing Functional Vulnerability Cirrhosis management cannot be separated from nutritional and physical function. The guideline conditionally suggests dietitian-guided nutritional interventions that provide adequate protein and calories. It also suggests structured aerobic and resistance exercise for ambulatory patients to improve muscle health and physical function. These recommendations recognize that clinical outcomes are influenced by more than biochemical indices and measures of portal hypertension. Malnutrition, reduced muscle strength, and impaired physical performance can complicate long-term care. Nevertheless, nutritional interventions should be individualized. Patients differ in body composition, obesity status, functional capacity, nutritional needs, and complications of liver disease. Similarly, structured exercise requires appropriate selection and adjustment rather than a uniform activity prescription. The guideline does not establish that every patient will achieve equivalent functional improvement or that a particular exercise program definitively reduces mortality. For clinicians, the relevant practice signal is to make nutrition and physical function active components of longitudinal assessment. This may require closer collaboration with dietitians and rehabilitation professionals rather than expecting hepatology consultations alone to deliver all necessary interventions. 8. Alcohol Use, Smoking, and Bone Health Beyond the Liver The guideline also addresses modifiable behaviors and extrahepatic conditions. For patients hospitalized with cirrhosis and alcohol use disorder, the ACG conditionally suggests postdischarge behavioral therapy to reduce alcohol use. This recommendation highlights the importance of continuity after hospitalization. An inpatient admission may create an opportunity to identify alcohol-related needs, but preventive benefit depends on successful transition to ongoing care. The guideline separately makes a strong recommendation for smoking-cessation counseling in patients with cirrhosis who actively smoke. Smoking prevention is relevant to overall health and should not be treated as unrelated to hepatology. Bone health is another important component. For patients with cirrhosis and osteoporosis, the guideline conditionally suggests bisphosphonate therapy to reduce fracture risk. This recommendation concerns patients with established osteoporosis; it is not a recommendation for universal bisphosphonate treatment in cirrhosis. Treatment requires assessment of conventional indications, contraindications, tolerability, and relevant comorbidities. Together, these recommendations reinforce a whole-patient approach. Preventive care should consider the consequences of liver disease alongside other conditions that influence functional health, quality of life, and future healthcare needs. 9. Turning Recommendations Into Reliable Clinical Practice The guideline's implementation framework emphasizes three complementary activities: education and dissemination, stakeholder engagement, and integration into routine practice. This is particularly relevant because preventive recommendations span multiple clinical environments. Specialist clinics may initiate portal hypertension assessment and HCC surveillance, while vaccination, smoking cessation, nutrition, rehabilitation, and postdischarge support frequently involve other healthcare professionals. A reasonable implementation approach is a structured preventive-care review incorporating disease-specific complications, immunization status, lifestyle needs, nutritional function, and bone health. Electronic health records may also help identify overdue assessments and follow-up requirements. However, the guideline does not demonstrate that any single checklist, electronic reminder, or implementation strategy independently improves survival. Preventive systems should therefore be evaluated for feasibility, reliability, and patient-centered outcomes. The evidence base also has broader limitations. Most recommendations rely on low-certainty evidence, and different interventions address substantially different outcomes. Results from studies involving specific cirrhosis populations may not apply equally to patients with advanced decompensation, major comorbidities, or limited access to multidisciplinary services. Future research should prioritize clinically meaningful outcomes, comparative effectiveness, intervention tolerability, and implementation across diverse healthcare systems. Importantly, a strong recommendation is not synonymous with high-certainty evidence, and an observational association should not be presented as proof of causation. Clinical Takeaway: Prevention Must Become a Routine Part of Cirrhosis Care The 2026 ACG guideline presents prevention as a longitudinal responsibility rather than an additional task performed only after complications develop. Its recommendations support appropriate variceal prophylaxis, risk-informed portal hypertension management, HCC surveillance, vaccination, targeted encephalopathy prevention, nutritional intervention, physical activity, behavioral support, and osteoporosis treatment. The principal clinical message is not that every intervention is equally effective or universally applicable. Instead, the most useful change is to make preventive assessment systematic, individualized, and continuous throughout cirrhosis care. GastroAGI Perspective: This guideline offers a practical framework for more comprehensive management of cirrhosis. Its strongest signals concern established preventive interventions and reliable delivery of care. However, low evidence certainty across many recommendations, variable patient eligibility, and unresolved implementation questions require careful clinical interpretation. Primary Source / Reference Tapper EB, Kardashian A, Debes JD, Gripshover J, Moon AM, Kim JJ, Lai JC. ACG Clinical Guideline: Preventive Care for Patients With Cirrhosis. American Journal of Gastroenterology. Published online October 5, 2026. DOI: https://doi.org/10.14309/ajg.0000000000004186 Official ACG guideline directory: https://gi.org/guidelines/ Five key clinical takeaways 1. Prevent decompensation proactively. Carvedilol or EVL is strongly recommended for high-risk esophageal varices; carvedilol is conditionally suggested in compensated cirrhosis with CSPH to reduce first-episode ascites. 2. Maintain six-monthly HCC surveillance in eligible patients. The recommended strategy is ultrasound plus AFP. Aspirin should not be initiated solely for HCC prevention. 3. Distinguish stages of hepatic encephalopathy. Lactulose may be considered for minimal HE; adjunctive rifaximin is suggested following overt HE despite lactulose, not routinely for primary prevention in minimal HE. 4. Make vaccination and functional health routine priorities. Review hepatitis A and B immunity, respiratory immunization, nutritional status, physical function and smoking at appropriate clinical encounters. 5. Treat cirrhosis as a whole-patient condition. Postdischarge behavioral treatment for alcohol use disorder, dietitian-guided nutrition, structured exercise and osteoporosis treatment are important components of preventive care, although several recommendations are conditional."
