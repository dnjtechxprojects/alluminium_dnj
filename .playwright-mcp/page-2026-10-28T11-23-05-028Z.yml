                  - paragraph [ref=e111]: "When should a patient with primary biliary cholangitis move beyond ursodeoxycholic acid, and how confidently can clinicians predict that newer treatment will improve long-term outcomes? This question has become increasingly relevant as the therapeutic landscape of primary biliary cholangitis (PBC) expands. Ursodeoxycholic acid (UDCA) remains the foundation of treatment, but biochemical nonresponse, progressive fibrosis, persistent pruritus, and uncertainty regarding second-line treatment selection continue to complicate clinical management. The 2026 joint clinical practice guideline from the American Association for the Study of Liver Diseases (AASLD) and the American Gastroenterological Association (AGA) addresses six important decisions along the PBC care pathway. Published online in Hepatology on October 22, 2026, with a parallel publication in Gastroenterology , the guideline reflects an important evolution in PBC management: treatment decisions increasingly incorporate biochemical response, noninvasive prognostic assessment, symptom burden, and individual patient preferences. However, the strength of evidence varies considerably across recommendations. While UDCA has an established therapeutic role, evidence supporting newer agents is stronger for improving biochemical outcomes than for preventing liver transplantation or mortality. Understanding that distinction is essential when translating the guidance into clinical practice. 1. A Focused Guideline for a Changing Treatment Landscape The AASLD–AGA document is a joint, evidence-based clinical practice guideline rather than a single interventional study. A multidisciplinary panel conducted systematic reviews addressing six prioritized clinical questions. Recommendations were developed using the Grading of Recommendations Assessment, Development and Evaluation (GRADE) framework, including an Evidence-to-Decision process that considered benefits, harms, certainty of evidence, patient preferences, feasibility, and resource implications. The target population comprises adults with PBC, including treatment-naïve patients, individuals with inadequate response or intolerance to UDCA, patients experiencing cholestatic pruritus, and liver transplant recipients. The six recommendations address: Diagnosis of suspected antimitochondrial antibody-negative PBC UDCA as first-line treatment Liver stiffness measurement for prognostication Peroxisome proliferator-activated receptor (PPAR) agonists as second-line therapy Linerixibat for moderate-to-severe cholestatic pruritus UDCA prophylaxis following liver transplantation Importantly, only the recommendation supporting first-line UDCA is strong. The remaining five are conditional, with evidence certainty ranging from moderate to very low. The guideline therefore offers a structured approach to clinical decisions without implying that every recommendation has equivalent evidentiary support. 2. Diagnosing AMA-Negative PBC: The Value and Limits of Additional Serology An important diagnostic challenge arises when patients have persistent cholestatic liver biochemistry and clinical suspicion of PBC but test negative for antimitochondrial antibodies (AMA). Traditionally, such patients may require liver biopsy when other investigations do not establish the diagnosis. The new guideline conditionally suggests testing for anti-sp100 and anti-gp210 antibodies before proceeding to biopsy. These PBC-specific antinuclear antibodies have relatively high specificity but limited sensitivity. In the guideline's pooled analysis, anti-sp100 demonstrated approximately 22.7% sensitivity and 96.5% specificity, while anti-gp210 demonstrated 19.7% sensitivity and 99.0% specificity. Their principal clinical value is therefore diagnostic confirmation rather than exclusion. A positive result in an appropriately selected patient may support PBC diagnosis without liver biopsy. Conversely, negative results cannot reliably exclude PBC when clinical suspicion remains high. The panel also emphasizes that these investigations should not be used for general population screening. Evidence certainty is very low, partly because diagnostic studies were predominantly case-control investigations with methodological limitations. In low-prevalence settings, false-positive results remain a concern despite high specificity. For clinicians, the practical message is to use these antibodies within a carefully evaluated cholestatic diagnostic pathway, not as standalone tests. 3. UDCA Remains the Foundation of Disease-Modifying Treatment Despite increasing interest in novel therapies, the clearest therapeutic recommendation is unchanged. The guideline strongly recommends UDCA for treatment-naïve patients with PBC, supported by moderate-certainty evidence. The recommended dose is 13–15 mg/kg/day , initiated at diagnosis. Randomized evidence demonstrates improvement in cholestatic biochemical parameters and reduced histological progression. In the guideline's analysis, histological progression occurred in 23.5% of UDCA-treated patients compared with 38.2% of controls, corresponding to a relative risk of 0.62. However, randomized trials did not establish a statistically clear reduction in mortality or the composite of mortality and liver transplantation. Their relatively short duration and low event rates limited their ability to assess these long-term outcomes. Supportive observational evidence has demonstrated an association between UDCA treatment and improved transplant-free survival, although such findings must not be interpreted as equivalent to randomized proof of causation. The guideline nevertheless judges the overall balance of benefits, safety, and clinical experience sufficient for a strong recommendation. Two implementation details are particularly relevant. First, persistent alkaline phosphatase (ALP) elevation does not justify abandoning UDCA. Continued treatment is recommended even when biochemical response is incomplete. Second, increasing UDCA above 15 mg/kg/day is not recommended as a strategy for persistent ALP elevation or symptom control. UDCA also should not be expected to reliably resolve fatigue or pruritus. Thus, treatment initiation represents the beginning of longitudinal disease assessment, rather than completion of the therapeutic strategy. 4. Liver Stiffness Adds a Prognostic Dimension Beyond Biochemistry Biochemical response remains central to PBC management, but patients with similar ALP levels may have different degrees of fibrosis and different risks of future complications. The guideline conditionally suggests liver stiffness measurement (LSM) to improve prognostication, supported by moderate-certainty evidence. In particular, liver stiffness of 10 kPa or greater , measured using vibration-controlled transient elastography (VCTE), identifies patients associated with a higher risk of adverse clinical outcomes. Such patients may warrant closer monitoring and consideration of treatment escalation, interpreted alongside biochemical findings and other clinical factors. The document also highlights an important distinction in longitudinal elastography: the most recent absolute liver stiffness measurement may be more informative prognostically than the difference between successive measurements. However, several questions remain unresolved. The optimal frequency for repeat elastography has not been established, and the evidence does not define a universal monitoring schedule. Much of the prognostic literature also predates the introduction of newer PPAR agonists. Furthermore, an association between liver stiffness and prognosis does not demonstrate that changing treatment solely to reduce liver stiffness will improve survival. For clinical practice, LSM should be considered an additional risk-stratification tool rather than an isolated treatment target. 5. Second-Line PPAR Agonists: Better Biochemical Response, Uncertain Long-Term Benefit The most consequential therapeutic development concerns patients whose biochemical response to UDCA remains inadequate or who cannot tolerate UDCA. The guideline conditionally suggests the PPAR agonists elafibranor and seladelpar as add-on treatment for inadequate responders or alternative monotherapy for UDCA-intolerant individuals. This recommendation is supported by low-certainty evidence. Biochemical response should generally be evaluated between 6 and 12 months after initiating UDCA. Although response definitions vary, many studies classify inadequate response using an ALP threshold of approximately 1.5–1.67 times the upper limit of normal together with normal total bilirubin at 12 months. The guideline also recognizes ALP normalization as a desirable goal where achievable, particularly for patients with greater prognostic risk. Randomized trials of elafibranor and seladelpar demonstrated substantially higher biochemical response rates than placebo. Both agents also improved the likelihood of ALP normalization. These findings provide credible evidence of biochemical efficacy. Nevertheless, the primary outcomes largely relied on surrogate measures rather than direct demonstration of reduced hepatic decompensation, transplantation, or death. The guideline explicitly identifies this distinction as a major reason for downgrading evidence certainty. Elafibranor and seladelpar had received accelerated US FDA approval for second-line PBC treatment at guideline publication. However, accelerated regulatory approval and improvement in biochemical endpoints should not be equated with established long-term survival benefit. The document also reviews fibrates, including bezafibrate and fenofibrate, which have been used off-label in some settings. Their evidence base is less robust, with additional limitations related to study design and safety assessment. Treatment selection therefore requires attention to clinical severity, biochemical response, patient preferences, drug availability, and potential adverse effects. The guideline advises against PPAR agonist use during pregnancy, breastfeeding, and decompensated cirrhosis because adequate efficacy and safety data are lacking. It also recommends longitudinal monitoring after treatment initiation, with quarterly laboratory assessment during the first year suggested on the basis of expert opinion. Crucially, no head-to-head evidence establishes a definitive superior choice between elafibranor and seladelpar across all clinically relevant outcomes. 6. Cholestatic Pruritus Deserves a Separate Therapeutic Decision Pruritus can substantially affect quality of life in PBC, including sleep, daily functioning, and psychological well-being. Its clinical importance may not correspond directly to the severity of biochemical abnormalities or fibrosis. The guideline conditionally suggests linerixibat , an ileal bile acid transporter inhibitor, as an option for moderate-to-severe PBC-associated cholestatic pruritus. Evidence certainty is low. The panel reviewed two randomized trials involving 296 patients receiving linerixibat 40 mg twice daily or placebo. In the phase 3 trial, the mean between-group difference in Worst Itch Numeric Rating Scale scores was approximately 0.78 points on an 11-point scale. Although statistically meaningful treatment effects were identified, the average difference was modest, and individual responses varied. The guideline therefore emphasizes shared decision-making rather than assuming uniform symptom improvement. Gastrointestinal adverse effects, particularly diarrhea and abdominal pain, and treatment costs may influence the decision. A therapeutic trial lasting approximately 2–12 weeks may help establish individual benefit and tolerability before considering longer-term continuation. The evidence remains insufficient for patients with mild pruritus, and safety in decompensated cirrhosis is uncertain because such patients were excluded from the relevant trials. There are also no direct comparative studies establishing superiority over historically used antipruritic treatments. For gastroenterologists, this recommendation reinforces a clinically important distinction: biochemical disease control and symptom management are related but separate objectives. 7. Preventing Recurrent PBC After Liver Transplantation The guideline extends beyond medical treatment before transplantation to address prevention of recurrent PBC in liver transplant recipients. It conditionally suggests UDCA prophylaxis following transplantation, preferably initiated as soon as possible, at 13–15 mg/kg/day. However, evidence certainty is very low. The supporting evidence comes from retrospective comparative cohorts rather than randomized prophylaxis trials. Across two studies involving 1,084 recipients, the pooled estimate did not establish a statistically significant reduction in recurrent PBC. An association with reduced graft failure was observed in one cohort, but this finding remains vulnerable to residual confounding and other limitations inherent to observational research. The guideline also did not establish a clear reduction in all-cause mortality. Accordingly, this recommendation represents a judgment balancing potential benefit, tolerability, and the consequences of graft failure, rather than definitive causal evidence. Transplant teams should interpret the recommendation within individualized long-term follow-up protocols. 8. Translating Six Recommendations Into a Risk-Based PBC Care Pathway Taken together, the recommendations support a more structured approach to PBC management. The first priority is establishing an accurate diagnosis, including further antibody assessment when AMA testing is negative and clinical suspicion persists. Next comes early initiation of appropriately dosed UDCA, followed by documented biochemical response assessment. Liver stiffness adds a prognostic dimension that can help identify individuals requiring closer attention. For patients with an inadequate response, second-line treatment decisions should incorporate biochemical results, underlying disease severity, treatment tolerability, symptom burden, and patient preferences. Importantly, the guideline does not resolve every therapeutic decision. Whether earlier PPAR agonist initiation benefits patients with relatively modest residual ALP elevation remains uncertain. The optimal management of patients who fail second-line therapy is also insufficiently defined. Prospective evidence is needed to determine whether biochemical improvements with newer drugs translate into lower rates of decompensation, transplantation, and death. Additional research should clarify appropriate elastography intervals, comparative treatment effectiveness, predictors of therapeutic response, and long-term medication safety. These uncertainties matter because PBC is a slowly progressive disease. Demonstrating improvement in a laboratory marker over months is considerably easier than establishing durable benefits over years. Clinical Takeaway: Personalization Must Follow Evidence Strength The 2026 AASLD–AGA guideline provides an important framework for contemporary PBC care. Its strongest foundation remains early and sustained UDCA treatment. The additional recommendations refine diagnostic assessment, prognostic stratification, treatment escalation, pruritus management, and post-transplant care. Newer PPAR agonists offer meaningful biochemical improvements, while linerixibat provides an additional option for selected patients with troublesome pruritus. However, the evidence supporting these approaches is not uniform, and several important long-term outcomes remain unresolved. GastroAGI Perspective: The principal practice signal is a move toward risk-informed, individualized PBC management—not indiscriminate treatment escalation. Clinicians should act on established recommendations while recognizing that biochemical efficacy, prognostic association, and demonstrated clinical benefit represent different levels of evidence. Reference / Source Levy C, Mayo MJ, Carey EJ, et al. AASLD AGA Clinical Practice Guideline on Management of Primary Biliary Cholangitis. Hepatology. Published online October 22, 2026. DOI: https://doi.org/10.1097/HEP.0000000000001875 Official AASLD announcement: https://www.aasld.org/aasld-and-aga-offer-first-medication-focused-guideline-treating-pbc Five key clinical takeaways 1. UDCA remains first-line therapy at 13–15 mg/kg/day. It should generally be continued despite an incomplete biochemical response, with escalation assessed separately. 2. Anti-sp100 and anti-gp210 help evaluate AMA-negative PBC. Their high specificity can support diagnosis, but low sensitivity means negative results do not exclude the disease. 3. Liver stiffness improves prognostic assessment. A VCTE measurement of 10 kPa or greater identifies increased risk but is not, by itself, a universal indication for treatment escalation. 4. Elafibranor and seladelpar offer second-line biochemical efficacy. Their recommendation is conditional, and improvements in transplantation-free survival or mortality have not yet been established through long-term randomized evidence. 5. Treat pruritus and post-transplant recurrence risk as distinct clinical priorities. Linerixibat may benefit selected patients with moderate-to-severe itching, while post-transplant UDCA prophylaxis is suggested on very-low-certainty evidence."
