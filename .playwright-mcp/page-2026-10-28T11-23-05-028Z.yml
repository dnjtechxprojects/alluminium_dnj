                  - 'heading "Serrated Polyposis Syndrome: 2026 US Multi-Society Recommendations for Diagnosis, Endoscopic Management and Surveillance" [level=2] [ref=e82]'
                  - paragraph [ref=e83]: "How many serrated polyps must an endoscopist identify before a patient is recognized as having a colorectal cancer predisposition syndrome—and what happens when those polyps are documented across several colonoscopies rather than a single examination? This question captures one of the central challenges in managing serrated polyposis syndrome (SPS). Unlike some hereditary polyposis syndromes, SPS is primarily defined by a cumulative endoscopic phenotype rather than a specific germline mutation. Patients may undergo repeated colonoscopies, each identifying several serrated lesions, without their overall polyp burden being recognized. The consequences extend beyond diagnostic terminology. Recognizing SPS changes colorectal cancer (CRC) risk assessment, endoscopic management, surveillance intervals, and screening recommendations for first-degree relatives. In September 2026, the US Multi-Society Task Force (USMSTF) on Colorectal Cancer published a consensus statement addressing these clinical decisions. Developed jointly by representatives of the American College of Gastroenterology (ACG), American Gastroenterological Association (AGA), and American Society for Gastrointestinal Endoscopy (ASGE), the document provides 11 recommendations for identifying and managing SPS. An October 21, 2026, ACG Evidence-Based GI commentary subsequently highlighted the recommendations' practical relevance. The central message is that successful SPS management begins before surveillance is scheduled: it requires accurate cumulative diagnosis, high-quality lesion detection, and effective endoscopic clearance. 1. Why Serrated Polyposis Remains Underrecognized SPS is considered the most common gastrointestinal polyposis syndrome, yet recognition in routine practice remains inconsistent. The USMSTF document cites an estimated prevalence of approximately one in 250 individuals in screening colonoscopy cohorts, although estimates vary across populations and detection settings. The difficulty is partly related to serrated lesion morphology. Sessile serrated lesions (SSLs) may be subtle, and a patient's relevant lesions may have been detected and removed by different endoscopists over several years. Unlike conventional approaches that interpret each colonoscopy independently, SPS diagnosis requires integrating the patient's cumulative polyp history. This distinction has substantial clinical importance because the diagnosis identifies a population at increased risk of both prevalent and incident CRC. The recommendations therefore treat documentation, lesion detection, and historical record review as essential components of clinical management rather than administrative details. For gastroenterologists, a patient with several proximal serrated lesions should prompt consideration of the complete lifetime polyp burden, even when findings from the current procedure alone do not satisfy diagnostic criteria. 2. What the 2026 Consensus Actually Evaluated The 2026 publication is an evidence-informed expert consensus statement, not an interventional trial. The USMSTF comprised nine members, with three representatives from each participating society. With research librarian support, the authors reviewed English-language literature indexed between January 1, 2005, and June 20, 2025. Searches included MEDLINE, EMBASE, the Cochrane Database of Systematic Reviews, and the Database of Abstracts of Reviews and Effects. The review addressed SPS diagnosis, endoscopic quality, lesion removal, cancer risk, surveillance, genetic evaluation, and family screening. Case reports and studies involving inflammatory bowel disease populations were excluded. Recommendations were graded using the 2011 Oxford Centre for Evidence-Based Medicine levels, with recommendation strength determined through expert consensus. The document is formally designated a set of recommendations , rather than an individual society clinical practice guideline, because its development process follows the separate USMSTF charter. There was no single enrolled study population, randomized intervention, or prospectively defined primary outcome. Instead, conclusions were derived from published evidence and expert evaluation. This methodological distinction is important: a strong consensus recommendation does not necessarily indicate high-certainty evidence from randomized studies. 3. Applying the 2019 WHO Criteria Requires Lifetime Polyp Tracking The USMSTF strongly recommends using the 2019 World Health Organization criteria for SPS diagnosis, although this recommendation is supported by Oxford Level 5 evidence. Under these criteria, SPS can be diagnosed through either of two phenotypes. Type 1: At least five serrated polyps proximal to the rectum, all measuring at least 5 mm, with at least two measuring 10 mm or larger. Type 2: More than 20 serrated polyps distributed throughout the colon, with at least five proximal to the rectum. Eligible lesions include hyperplastic polyps, SSLs, and traditional serrated adenomas. Importantly, the polyp count is cumulative across colonoscopies. A patient who does not satisfy SPS criteria during one examination may fulfill them after incorporating previously resected lesions. The task force therefore strongly recommends documenting serrated polyp number, size, and location whenever multiple lesions are detected, continuing at least until SPS is established. A practical report should distinguish lesions by colonic location and size category, allowing clinicians to reconstruct the cumulative phenotype. This approach also highlights the importance of retrieving previous colonoscopy and histopathology reports. The recommendation is straightforward, but implementation can be difficult when patients move between healthcare systems or earlier endoscopy reports lack adequate lesion descriptions. 4. Endoscopist Detection Quality Is Part of SPS Management Accurate diagnosis depends on the ability to detect serrated lesions consistently. The task force recommends that patients with SPS undergo colonoscopy by endoscopists with documented adequate SSL detection performance, using an SSL detection rate of at least 6% during routine colonoscopy. This recommendation is strong despite Oxford Level 5 evidence. The panel also recommends high-definition white-light colonoscopy, with or without virtual or dye-spray chromoendoscopy. The objective is meticulous mucosal inspection, particularly because subtle or overlooked serrated lesions can undermine both diagnosis and subsequent surveillance. In his ACG commentary, Joseph Anderson notes that higher SSL detection rates may be desirable, discussing 8% as an aspirational quality benchmark. However, this higher target should be distinguished from the formal task force recommendation of at least 6%. Observational studies linking higher serrated lesion detection rates with lower postcolonoscopy CRC risk provide supportive evidence. They do not independently establish that a particular detection threshold causally prevents cancer. For an endoscopy service, the practical implications extend beyond individual technique. Good bowel preparation, careful inspection, standardized lesion documentation, and access to experienced endoscopists are integral to reliable SPS care. 5. Understanding CRC Risk Without Overinterpreting Surveillance Data SPS is associated with increased CRC risk, but the timing of diagnosis is central to interpreting published estimates. The consensus statement cites a meta-analysis of 36 studies involving 2,788 patients. The reported CRC risk was 14.7% at SPS diagnosis, while CRC identified before diagnosis was reported in 7.7% of patients. These figures emphasize that a substantial proportion of cancers are recognized before or around the time SPS is established. The same evidence synthesis reported CRC in 2.8% of patients during surveillance, with follow-up durations varying across studies. These estimates should not be interpreted as directly comparable treatment effects. Patients receiving surveillance may differ from those diagnosed with cancer, and observational cohorts vary in baseline risk, clearance quality, surveillance intensity, and follow-up duration. Consequently, lower CRC occurrence during structured surveillance is clinically encouraging but does not, by itself, quantify the causal benefit of a specific surveillance schedule. The consensus also identifies higher CRC risk among patients meeting Type 1 criteria or both SPS phenotypes compared with Type 2 alone. Dysplastic SSLs and concurrent advanced conventional adenomas are additional risk markers. Such observations support individualized risk assessment while reinforcing the need for effective lesion removal. 6. Endoscopic Clearance Before Surgery: A Central Management Principle A major practice-oriented recommendation is that endoscopic management should be preferred over surgery in patients with SPS who do not have concurrent CRC. This is a strong recommendation supported by Oxford Level 3 evidence. The rationale is that many patients can achieve adequate polyp control through repeated, high-quality therapeutic colonoscopy. For SSLs and hyperplastic polyps, the panel recommends cold-snare resection, with or without submucosal injection for larger lesions, except when endoscopic features suggest dysplasia. The choice of resection technique should therefore account for lesion morphology and concerning features, rather than applying cold-snare treatment indiscriminately. The document emphasizes removing lesions to achieve adequate clearance, including serrated lesions of at least 5 mm and clinically relevant conventional adenomas. When the lesion burden appears too extensive for routine endoscopic management, referral to an advanced endoscopic resection expert is suggested before proceeding to surgery. This referral recommendation is weak and supported by Oxford Level 5 evidence, reflecting substantial reliance on expert judgment. Surgery remains appropriate when CRC is present or the polyp burden cannot be controlled endoscopically despite expert assessment. The important distinction is that SPS diagnosis alone should not automatically trigger colectomy. Availability of advanced endoscopic expertise, repeated procedure requirements, lesion complexity, and patient preferences remain relevant to management decisions. 7. From Clearance to Surveillance: Why the Two Phases Matter The consensus separates SPS colonoscopy management into two clinically distinct phases. During the clearance phase , repeat colonoscopy is recommended at intervals of approximately 3–6 months until the relevant polyp burden has been adequately removed. Some patients require multiple therapeutic examinations, particularly when numerous lesions cannot be safely or completely resected during a single procedure. Once clearance is achieved, patients enter a surveillance phase , generally involving colonoscopy every 1–2 years. This recommendation is strong and supported by Oxford Level 3 evidence. The distinction matters because a short-interval examination during active clearance serves a different objective from routine surveillance after effective polyp control. The task force also suggests considering extension to a 3-year interval in selected patients whose polyp burden has been greatly reduced during surveillance. This recommendation is weak, supported by Oxford Level 5 evidence. It should not be interpreted as approval for routine 3-year surveillance in all patients with SPS. Evidence supporting longer intervals remains limited, particularly regarding how consistently low polyp burden must be maintained before extension is considered safe. The recommendations assume complete colonoscopy, adequate bowel preparation, and strong lesion-detection performance. Patients with dysplastic SSLs, advanced conventional adenomas, or substantial recurrent polyp burden may require more intensive follow-up. The central principle is that surveillance intervals should reflect the effectiveness of clearance and subsequent findings rather than diagnosis alone. 8. Genetic Testing and Family Screening Require Different Decisions Although SPS can cluster within families, no common germline pathogenic variant consistently explains the syndrome. The USMSTF therefore recommends germline genetic testing only when additional clinical features independently suggest a recognized hereditary gastrointestinal cancer syndrome. Examples include substantial concurrent conventional adenomatous or hamartomatous polyposis or a relevant family history. This approach avoids assuming that all SPS patients require comprehensive germline testing solely because they satisfy the SPS phenotype. However, absence of an established genetic cause does not mean that relatives have average CRC risk. Studies reviewed by the task force reported increased CRC risk among first-degree relatives, although the evidence is observational and results are not entirely consistent. The task force suggests colonoscopic screening for first-degree relatives beginning at the earliest of age 40, ten years before the youngest CRC diagnosis in the family, or five years before the youngest SPS diagnosis in the family. This is a weak recommendation supported by Oxford Level 4 evidence. For clinical practice, a confirmed SPS diagnosis should therefore prompt family-history review and communication regarding relatives' screening needs. Genetic testing and colonoscopic screening address different questions and should not be treated as interchangeable interventions. 9. Where Implementation and Research Still Fall Short Several uncertainties limit how precisely clinicians can individualize SPS management. First, surveillance evidence is predominantly observational. Randomized comparisons of surveillance intervals are lacking, and existing cohorts often originate from experienced referral centers. Outcomes achieved in those settings may not be reproduced where lesion detection, resection expertise, or follow-up systems are less consistent. Second, the ideal surveillance interval for patients with persistently minimal polyp burden is not established. Three-year surveillance remains an option for selected patients rather than a universally validated strategy. Third, the task force identifies additional research needs concerning CRC incidence during surveillance and the management of challenging peri-appendiceal serrated lesions. The implications for endoscopy services are practical. Standardized reporting of cumulative serrated polyp burden, access to historical pathology, documented detection quality, and referral pathways for advanced resection may help improve consistency. These are reasonable implementation priorities based on the consensus, although their independent impact on long-term CRC outcomes has not been established by prospective comparative trials. The statement provides a coherent framework for care but should not be interpreted as definitive evidence that any particular surveillance interval or technical strategy eliminates cancer risk. Clinical Takeaway: Recognition and Clearance Come Before Surveillance The 2026 USMSTF recommendations clarify an important clinical priority: effective SPS care begins with accurate recognition of the cumulative polyp phenotype. The most directly actionable recommendations concern use of 2019 WHO diagnostic criteria, longitudinal documentation, high-quality lesion detection, endoscopic clearance, and structured follow-up. Endoscopic management remains preferred for patients without concurrent CRC, with advanced resection expertise considered before surgery for difficult polyp burdens. Surveillance generally follows a 3–6-month clearance phase and a subsequent 1–2-year maintenance strategy, with cautious interval extension in selected patients. GastroAGI Perspective: These recommendations provide a practical, consensus-based framework for managing a frequently overlooked colorectal cancer predisposition syndrome. Their greatest immediate value lies in improving recognition, procedural quality, and continuity of surveillance. However, much of the supporting evidence remains observational or expert-derived, and stronger prospective data are needed to refine risk-based surveillance and confirm long-term clinical benefits. Primary Source Rex DK, Anderson JC, Burke CA, et al. Serrated Polyposis Syndrome: A Review and Consensus Statement by the US Multi-Society Task Force on Colorectal Cancer. American Journal of Gastroenterology. Published online September 30, 2026. https://doi.org/10.14309/ajg.0000000000004081 Parallel Publication Gastrointestinal Endoscopy. Published online September 30, 2026. https://doi.org/10.1016/j.gie.2026.09.002 Official Clinical Commentary Anderson JC. US Multi-Society Task Force on Colorectal Cancer Recommendations for Diagnosis and Management of Serrated Polyposis Syndrome. ACG Evidence-Based GI. October 21, 2026. https://gi.org/journals-publications/ebgi/anderson_oct2026/ Five key clinical takeaways 1. SPS diagnosis requires cumulative polyp tracking. Apply the 2019 WHO criteria using the number, size, and location of serrated lesions across colonoscopies, rather than interpreting individual examinations in isolation. 2. High-quality detection is essential. The USMSTF recommends colonoscopy by endoscopists with an SSL detection rate of at least 6%, alongside appropriate equipment, preparation, and careful inspection. 3. Endoscopic management is preferred over surgery in patients without concurrent CRC. Cold-snare resection is recommended for appropriate serrated lesions, and complex polyp burdens should undergo expert assessment before colectomy is considered. 4. Surveillance follows a two-phase approach. Repeat colonoscopy every 3–6 months during clearance, followed by surveillance every 1–2 years. Three-year intervals may be considered in selected patients with sustained, markedly reduced polyp burden, but the evidence is weak. 5. Family screening is important even without an established genetic cause. First-degree relatives warrant colonoscopic screening according to the recommended age and family-history thresholds. Routine germline testing is not indicated solely by an SPS diagnosis."
